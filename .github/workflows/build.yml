name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SourcePawn compiler
        uses: rumblefrog/setup-sp@master
        with:
          version: "1.12.x"

      - name: Compile
        run: |
          mkdir -p plugins
          spcomp -i addons/sourcemod/scripting/include -o plugins/showbrushes.smx addons/sourcemod/scripting/showbrushes.sp

      - uses: actions/upload-artifact@v4
        with:
          name: showbrushes
          path: plugins/showbrushes.smx
